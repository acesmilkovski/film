<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Playlist Movies</title>
  <!-- Font Awesome for icons (optional, but nice) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b0f15 0%, #1a212c 100%);
      min-height: 100vh;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #eef2f6;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      width: 100%;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header h1 {
      font-weight: 600;
      font-size: 2rem;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header h1 i {
      color: #ff4d4d;
      font-size: 2rem;
      filter: drop-shadow(0 0 6px rgba(255, 77, 77, 0.5));
    }

    .playlist-info {
      background: rgba(255, 255, 255, 0.05);
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      font-size: 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      gap: 8px;
      color: #b0c4de;
    }

    .playlist-info i {
      color: #ff4d4d;
    }

    .playlist-info span {
      color: #fff;
      font-weight: 500;
    }

    /* Movie Grid */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.8rem;
      margin: 1.5rem 0 2.5rem;
    }

    /* Movie Card */
    .movie-card {
      background: #1e2632;
      border-radius: 1.2rem;
      overflow: hidden;
      box-shadow: 0 15px 30px -8px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(2px);
      cursor: pointer;
    }

    .movie-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 25px 35px -10px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 77, 77, 0.3);
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0e1218;
      overflow: hidden;
    }

    .thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .movie-card:hover .thumbnail-container img {
      transform: scale(1.03);
    }

    .play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .movie-card:hover .play-overlay {
      opacity: 1;
    }

    .play-overlay i {
      font-size: 2.5rem;
      color: #fff;
      filter: drop-shadow(0 0 12px #ff4d4d);
      background: rgba(0, 0, 0, 0.6);
      border-radius: 50%;
      padding: 12px 12px 12px 16px;
      transition: 0.2s;
    }

    .movie-info {
      padding: 1rem 1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex: 1;
    }

    .movie-title {
      font-weight: 600;
      font-size: 1rem;
      line-height: 1.4;
      color: #ffffff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.2px;
    }

    .movie-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }

    .movie-meta .duration {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 30px;
    }

    .movie-meta .date {
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0.8;
    }

    /* Loading & Error states */
    .status-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 2rem;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      color: #a0b3cc;
      font-size: 1.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .status-message i {
      font-size: 2.2rem;
      color: #ff4d4d;
      opacity: 0.7;
    }

    .loader {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #ff4d4d;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Footer / note */
    .footer-note {
      text-align: center;
      font-size: 0.8rem;
      color: #5e6f84;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .footer-note a {
      color: #a0b3cc;
      text-decoration: none;
      border-bottom: 1px dotted rgba(255, 255, 255, 0.2);
    }

    .footer-note a:hover {
      color: #ff4d4d;
    }

    /* Modal for video playback */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #0f131a;
      border-radius: 1.5rem;
      max-width: 1000px;
      width: 100%;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
      overflow: hidden;
      position: relative;
      animation: modalFade 0.25s ease;
    }

    @keyframes modalFade {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1.5rem;
      background: #141b24;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .modal-header h3 {
      font-size: 1.1rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
      max-width: 80%;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 6px;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: #ff4d4d;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Responsive */
    @media (max-width: 600px) {
      body { padding: 1.2rem 1rem; }
      .header h1 { font-size: 1.5rem; }
      .movie-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1rem; }
      .movie-title { font-size: 0.9rem; }
      .modal-content { width: 100%; }
      .modal-header h3 { font-size: 0.95rem; }
      #footer-frame { height: 200px; margin-top: 1.5rem; }
    }
    /* ---------- FOOTER FRAME – FULL WIDTH (clean) ---------- */
#footer-frame {
  display: block;
  width: 100vw;
  height: 280px;               /* adjust as needed */
  border: none;
  margin: 2rem 0 0 0;
  padding: 0;
  /* pull to the very edges of the viewport */
  margin-left: calc(-50vw + 50%);
  margin-right: calc(-50vw + 50%);
  background: #0b0f15;         /* avoid white flash */
  box-sizing: border-box;
}
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>
        <i class="fab fa-youtube"></i> 
        Македонски Филмови
      </h1>
      <div class="playlist-info" id="playlistInfo">
        <i class="fas fa-list"></i> 
        <span id="playlistTitle">Loading playlist…</span>
      </div>
    </div>

    <!-- Movie grid (dynamic) -->
    <div id="movieGrid" class="movie-grid">
      <!-- Javascript will populate here -->
      <div class="status-message" id="loadingIndicator">
        <div class="loader"></div>
        <span>Fetching playlist videos…</span>
      </div>
    </div>

    <div class="footer-note">
      <i class="fas fa-film"></i> Click any movie to play · YouTube playlist videos
    </div>
  </div>

  <!-- Video Modal -->
  <div id="videoModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Now playing</h3>
        <button class="modal-close" id="closeModalBtn">&times;</button>
      </div>
      <div class="video-wrapper" id="videoWrapper">
        <!-- iframe will be injected -->
      </div>
    </div>
  </div>
<iframe id="footer-frame" src="https://footer-mkd.netlify.app/" frameborder="0"></iframe>
  <script>
    (function() {
      // --------------------------------------------------------------
      // CONFIGURATION: Replace with your YouTube playlist ID
      // --------------------------------------------------------------
      const PLAYLIST_ID = 'PLAeuy-_EcctAb0KzpBDMS9rULwKVIC4DZ';  // Example: "Top Movies" playlist (you can change it)
      // Note: This playlist ID is just a sample. Replace with any public playlist ID.

      // YouTube API key (public demo key - but for production you should restrict/use your own)
      // This key is widely used for demos and works for basic playlist data.
      // Replace with your own key if you hit quota limits.
      const API_KEY = 'AIzaSyCLi3xCHeS7mPruXLvhEvpyuPFlwCtS2Nk'; 
      // ⚠️ IMPORTANT: The above API key is a placeholder/dummy. It will NOT work.
      // You MUST replace it with a valid YouTube Data API v3 key.
      // For testing/demo purposes, you can get one from Google Cloud Console.
      // Alternatively, I can provide a fallback with sample data, but live API requires a real key.
      
      // --------------------------------------------------------------
      // For the sake of a working demo WITHOUT a real API key,
      // I'll include a FALLBACK dataset (simulated playlist items)
      // so you can see the UI immediately. 
      // Replace the API_KEY with your own to use live data.
      // --------------------------------------------------------------
      
      // Fallback sample movies (if API fails or key is invalid)
      const FALLBACK_MOVIES = [
        {
          videoId: 'dQw4w9WgXcQ',
          title: 'Rick Astley - Never Gonna Give You Up (Official Video)',
          thumbnail: 'https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg',
          publishedAt: '2009-10-25',
          duration: '3:33'
        },
        {
          videoId: '9bZkp7q19f0',
          title: 'PSY - GANGNAM STYLE(강남스타일) M/V',
          thumbnail: 'https://i.ytimg.com/vi/9bZkp7q19f0/hqdefault.jpg',
          publishedAt: '2012-07-15',
          duration: '4:13'
        },
        {
          videoId: 'kJQP7kiw5Fk',
          title: 'Luis Fonsi - Despacito ft. Daddy Yankee',
          thumbnail: 'https://i.ytimg.com/vi/kJQP7kiw5Fk/hqdefault.jpg',
          publishedAt: '2017-01-12',
          duration: '4:42'
        },
        {
          videoId: 'JGwWNGJdvx8',
          title: 'Ed Sheeran - Shape of You (Official Music Video)',
          thumbnail: 'https://i.ytimg.com/vi/JGwWNGJdvx8/hqdefault.jpg',
          publishedAt: '2017-01-30',
          duration: '4:24'
        },
        {
          videoId: 'RgKAFK5djSk',
          title: 'Wiz Khalifa - See You Again ft. Charlie Puth [Official Video]',
          thumbnail: 'https://i.ytimg.com/vi/RgKAFK5djSk/hqdefault.jpg',
          publishedAt: '2015-04-06',
          duration: '3:58'
        },
        {
          videoId: 'OPf0YbXqDm0',
          title: 'Mark Ronson - Uptown Funk (Official Video) ft. Bruno Mars',
          thumbnail: 'https://i.ytimg.com/vi/OPf0YbXqDm0/hqdefault.jpg',
          publishedAt: '2014-11-19',
          duration: '4:31'
        }
      ];

      // DOM elements
      const movieGrid = document.getElementById('movieGrid');
      const playlistTitleSpan = document.getElementById('playlistTitle');
      const loadingIndicator = document.getElementById('loadingIndicator');
      
      // Modal elements
      const modal = document.getElementById('videoModal');
      const modalTitle = document.getElementById('modalTitle');
      const videoWrapper = document.getElementById('videoWrapper');
      const closeModalBtn = document.getElementById('closeModalBtn');

      // --------------------------------------------------------------
      // 1. Fetch playlist items from YouTube Data API
      // --------------------------------------------------------------
      async function fetchPlaylistItems() {
        // If no API key or placeholder, use fallback
        if (!API_KEY || API_KEY.includes('YOUR_') || API_KEY.length < 20) {
          console.warn('Using fallback movie data (no valid API key provided).');
          return { items: FALLBACK_MOVIES, title: 'Sample Movies (Fallback)' };
        }

        const maxResults = 50; // YouTube API max per request
        const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=${maxResults}&playlistId=${PLAYLIST_ID}&key=${API_KEY}`;

        try {
          const response = await fetch(url);
          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(`YouTube API error: ${errorData.error?.message || response.status}`);
          }
          const data = await response.json();
          
          // Also fetch playlist title (optional)
          let playlistTitle = 'YouTube Playlist';
          try {
            const playlistUrl = `https://www.googleapis.com/youtube/v3/playlists?part=snippet&id=${PLAYLIST_ID}&key=${API_KEY}`;
            const titleRes = await fetch(playlistUrl);
            if (titleRes.ok) {
              const titleData = await titleRes.json();
              if (titleData.items?.length) {
                playlistTitle = titleData.items[0].snippet.title;
              }
            }
          } catch (e) {
            // ignore title fetch error
          }

          // Map to our movie format
          const movies = data.items.map(item => {
            const snippet = item.snippet;
            const videoId = snippet.resourceId.videoId;
            return {
              videoId: videoId,
              title: snippet.title,
              thumbnail: snippet.thumbnails?.high?.url || snippet.thumbnails?.medium?.url || snippet.thumbnails?.default?.url,
              publishedAt: snippet.publishedAt ? snippet.publishedAt.split('T')[0] : '',
              duration: '—' // We don't get duration from playlistItems, would need extra API call
            };
          });

          return { items: movies, title: playlistTitle };
        } catch (error) {
          console.error('Failed to fetch playlist:', error);
          // Fallback to demo data
          return { 
            items: FALLBACK_MOVIES, 
            title: 'Fallback Playlist (API error)',
            error: error.message 
          };
        }
      }

      // --------------------------------------------------------------
      // 2. Render movie cards
      // --------------------------------------------------------------
      function renderMovies(movies, playlistTitle) {
        // Update playlist title display
        playlistTitleSpan.textContent = playlistTitle || 'Playlist';

        // Remove loading indicator or any existing status
        movieGrid.innerHTML = '';

        if (!movies || movies.length === 0) {
          movieGrid.innerHTML = `
            <div class="status-message">
              <i class="fas fa-exclamation-triangle"></i>
              <span>No videos found in this playlist.</span>
            </div>
          `;
          return;
        }

        // Create cards
        movies.forEach(movie => {
          const card = document.createElement('div');
          card.className = 'movie-card';
          card.dataset.videoId = movie.videoId;
          card.dataset.title = movie.title;

          // Format date for display (optional)
          const displayDate = movie.publishedAt ? new Date(movie.publishedAt).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';

          card.innerHTML = `
            <div class="thumbnail-container">
              <img src="${movie.thumbnail}" alt="${movie.title}" loading="lazy" onerror="this.src='https://img.youtube.com/vi/${movie.videoId}/mqdefault.jpg'">
              <div class="play-overlay">
                <i class="fas fa-play"></i>
              </div>
            </div>
            <div class="movie-info">
              <div class="movie-title" title="${movie.title}">${movie.title}</div>
              <div class="movie-meta">
                <span class="duration"><i class="far fa-clock"></i> ${movie.duration || '—'}</span>
                <span class="date"><i class="far fa-calendar-alt"></i> ${displayDate || 'YouTube'}</span>
              </div>
            </div>
          `;

          // Add click event to open video modal
          card.addEventListener('click', (e) => {
            // Prevent if click originated from inner interactive element (not needed but fine)
            openVideoModal(movie.videoId, movie.title);
          });

          movieGrid.appendChild(card);
        });
      }

      // --------------------------------------------------------------
      // 3. Modal video player
      // --------------------------------------------------------------
      function openVideoModal(videoId, title) {
        modalTitle.textContent = title || 'Now playing';
        // Build YouTube embed iframe
        videoWrapper.innerHTML = `
          <iframe 
            src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0" 
            title="${title}"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        `;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden'; // Prevent background scroll
      }

      function closeVideoModal() {
        modal.classList.remove('active');
        videoWrapper.innerHTML = ''; // Stop video playback
        document.body.style.overflow = '';
      }

      // Close modal events
      closeModalBtn.addEventListener('click', closeVideoModal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeVideoModal(); // click on backdrop
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
          closeVideoModal();
        }
      });

      // --------------------------------------------------------------
      // 4. Initialize the page
      // --------------------------------------------------------------
      async function init() {
        try {
          // Show loading (already visible)
          const result = await fetchPlaylistItems();
          
          // If the API returned an error but we have fallback items, show a subtle note
          if (result.error) {
            console.warn('Using fallback data due to:', result.error);
            // Optionally show a small note in the UI (we'll keep the fallback title)
          }
          
          renderMovies(result.items, result.title);
        } catch (err) {
          console.error('Initialization error:', err);
          movieGrid.innerHTML = `
            <div class="status-message">
              <i class="fas fa-plug"></i>
              <span>Could not load playlist. ${err.message || 'Please try again later.'}</span>
            </div>
          `;
          playlistTitleSpan.textContent = 'Error';
        }
      }

      // Start the app
      init();
    })();
  </script>
</body>
</html>
